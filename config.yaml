# ============================================================
#  MenuBot ayarları
#  Gizli bilgiler (token) burada DEĞİL, .env dosyasında.
# ============================================================

data:
  # url   = internetten indir (GitHub raw linki / Sheets CSV yayın linki)
  # local = local_path dosyasından oku
  source: url

  # Excel'i GitHub'da güncellediğinde bot en geç cache_ttl_minutes içinde görür.
  url: "https://raw.githubusercontent.com/hdhalilhd/lunchnotice/main/Yemek_Listesi.xlsx"

  # source: local iken kullanılır (internet yokken yedek olarak da işe yarar)
  local_path: data/Yemek_Listesi.xlsx

  cache_ttl_minutes: 15

  # Tarih kolonunun adı (büyük/küçük harf farkı önemsiz)
  date_column: Tarih

  # Sadece .xlsx için. Boş = ilk sayfa.
  sheet_name: ""

# Mesajda gösterilecek kolonlar; sıra buradaki sıra ile aynı olur.
# Sol taraf = Excel'deki kolon adı, sağ taraf = mesajda görünecek başlık.
# "Gün" kolonu burada yok çünkü tarih satırı zaten günü yazıyor.
fields:
  "çorba": "🍲 Çorba"
  "ana yemek": "🍽️ Ana Yemek"
  "yan": "🥗 Yan"
  "ekstra": "🍮 Ekstra"

# Her sabah gruba atılan otomatik mesaj.
# ŞİMDİLİK KAPALI — grup açılınca true yap ve .env'e GROUP_CHAT_ID yaz.
daily_post:
  enabled: false
  time: "08:00"
  timezone: "Europe/Istanbul"
  # Menüde hafta sonu yok; boşuna çalışmasın.
  skip_weekends: true
  # O gün için veri yoksa (resmi tatil vb.) hiç mesaj atma
  skip_if_empty: true
  # Gruba atılan mesajın başına eklenen satır (boş bırakabilirsin)
  intro: "Günaydın! ☀️ Bugünün menüsü:"

messages:
  no_data: "{tarih} için menü bulamadım."
  not_understood: |
    Anlayamadım 🤔 Şu şekilde sorabilirsin:

    • bugün ne var
    • yarın ne var
    • çarşamba ne var
    • 24 eylül ne var
    • bu hafta

    Komutlar: /bugun  /yarin  /hafta  /yardim

# Yönetici Telegram kullanıcı id'leri. /yenile, /durum, /onizle bunlara açık.
# Bu depo herkese açık olabileceği için id'ler burada değil .env içinde:
#   ADMIN_IDS=111111,222222
# Boş bırakılırsa ve .env'de de yoksa bot "kurulum modu"nda çalışır
# (/chatid herkese açık olur).
admins: []
