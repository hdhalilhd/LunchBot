# ============================================================
#  MenuBot ayarları
#  Gizli bilgiler (token, grup id) burada DEĞİL, .env dosyasında.
# ============================================================

data:
  # local = data/menu.csv dosyasından oku
  # url   = internetten indir (GitHub raw linki veya Google Sheets CSV yayın linki)
  source: local

  local_path: data/menu.csv

  # source: url ise burası kullanılır. Örnekler:
  #   GitHub : https://raw.githubusercontent.com/KULLANICI/REPO/main/menu.csv
  #   Sheets : Dosya > Paylaş > Web'de yayınla > CSV  ile aldığın link
  url: ""

  # İndirilen veri kaç dakika bellekte tutulsun (url modunda)
  cache_ttl_minutes: 15

  # CSV'deki tarih kolonunun adı
  date_column: tarih

# Mesajda gösterilecek kolonlar. Sıra buradaki sıra ile aynı olur.
# Sol taraf = CSV kolon adı, sağ taraf = mesajda görünecek başlık.
# CSV'ye yeni kolon eklersen buraya da ekle; eklemezsen mesajda çıkmaz.
fields:
  kahvalti: "🍳 Kahvaltı"
  ogle: "🍽️ Öğle"
  aksam: "🌙 Akşam"
  not: "📝 Not"

# Her sabah gruba atılan otomatik mesaj
daily_post:
  enabled: true
  time: "08:00"
  timezone: "Europe/Istanbul"
  # Cumartesi/Pazar mesaj atılmasın mı?
  skip_weekends: false
  # O gün için veri yoksa hiç mesaj atma
  skip_if_empty: true
  # Gruba atılan mesajın başına eklenen satır (boş bırakabilirsin)
  intro: "Günaydın! ☀️ Bugünün programı:"

messages:
  no_data: "{tarih} için kayıtlı bir şey bulamadım."
  not_understood: |
    Anlayamadım 🤔 Şu şekilde sorabilirsin:

    • bugün ne var
    • yarın ne var
    • çarşamba ne var
    • 24 eylül ne var
    • bu hafta

    Komutlar: /bugun  /yarin  /hafta  /yardim

# Yönetici Telegram kullanıcı id'leri (sayı). /yenile, /onizle gibi
# komutları sadece bunlar kullanabilir. Boş bırakırsan kurulum modunda
# çalışır ve /chatid komutu herkese açık olur.
admins: []
